{% extends "base.html" %}
{% block title %}เข้าสู่ระบบ Wi-Fi{% endblock %}
{% block body %}
<h1>{{ gateway_name }}</h1>
<p class="sub">กรอกรหัสที่ได้รับจากพนักงานเพื่อใช้อินเทอร์เน็ต</p>

{% if error %}<div class="msg err">{{ error }}</div>{% endif %}

<form method="post" autocomplete="off">
  <input type="hidden" name="nonce" value="{{ nonce }}">

  <label for="username">ชื่อผู้ใช้</label>
  <input type="text" id="username" name="username" required autofocus
         autocapitalize="characters" placeholder="เช่น CAFE-8F3K2">

  <label for="password">รหัสผ่าน</label>
  <input type="text" id="password" name="password" required
         autocapitalize="characters" placeholder="รหัสผ่าน 8 ตัว">

  <button type="submit">เข้าใช้งาน</button>
</form>
<p class="hint">ยังไม่มีรหัส? แจ้งพนักงานพร้อมบัตรประชาชนเพื่อขอรหัสใหม่<br>
  <a href="/policy">นโยบายความเป็นส่วนตัว</a></p>
{% endblock %}
